<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f3fc">
  <meta name="description" content="Pilih, sunting dan eksport foto pada peranti anda.">
  <title>BPPicture Editor V1.0</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <header><div class="wrap head">
    <div class="brand"><img src="./icon.svg" alt="" width="38" height="38"><span>BPPicture Editor <span class="version">V1.0</span></span></div>
    <div class="head-tools" id="header-tools"></div>
  </div></header>
  <main class="wrap">
    <div class="intro" id="intro"></div>
    <nav class="steps" id="steps" aria-label="Aliran kerja"></nav>
    <div id="workspace"></div>
  </main>
  <footer class="actions" id="actions"></footer>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <input hidden type="file" id="files" accept="image/*" multiple>
  <input hidden type="file" id="native-camera" accept="image/*" capture="environment">
  <noscript>BPPicture Editor memerlukan JavaScript. BPPicture Editor requires JavaScript.</noscript>
</body>
</html>
